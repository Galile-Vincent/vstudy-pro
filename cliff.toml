[changelog]
header = """
# Changelog

Generated from Git history with git-cliff. Historical subjects are preserved.
Pre-baseline changes without a conventional prefix appear under Other changes.

"""
body = """
{% if version %}## {{ version }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {{ commit.message | split(pat="\n") | first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix|^Fix |^Repair |^Restore ", group = "Fixes" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs|^Document ", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^chore|^build|^ci", group = "Maintenance" },
  { message = "^Merge ", skip = true },
  { message = ".*", group = "Other changes" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
