<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .bootstrap-fallback { visibility:hidden; animation:bootstrap-timeout 0s 10s forwards; }
      .bootstrap-fallback > p { display:none; }
      html:lang(en) .bootstrap-fallback > p[lang=en],
      html:lang(zh) .bootstrap-fallback > p[lang=zh-Hant],
      html:lang(ja) .bootstrap-fallback > p[lang=ja] { display:block; }
      @keyframes bootstrap-timeout { to { visibility:visible; } }
    </style>
    <title>VStudy Pro</title>
  </head>
  <body>
    <div id="root"><!-- startup-fallback:start --><section class="bootstrap-fallback" role="alert"><p lang="en">This view could not be displayed. Try again to reopen it.</p><p lang="zh-Hant">無法顯示此畫面。請重試以重新開啟。</p><p lang="ja">この画面を表示できませんでした。再試行して開き直してください。</p></section><!-- startup-fallback:end --></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
