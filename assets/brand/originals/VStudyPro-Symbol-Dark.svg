    <stop offset="100%" stop-color="#CFD8FF"/>
  </linearGradient>
  <linearGradient id="violetLower" x1="150" y1="101" x2="188" y2="184" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#967DED"/><stop offset="48%" stop-color="#B3A1F4"/>
    <stop offset="100%" stop-color="#D5C6F9"/>
  </linearGradient>
  <!-- Upper wing fades gently where it folds over the lower wing -->
  <linearGradient id="upperFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="0.47" stop-color="#fff" stop-opacity="1"/>
    <stop offset="0.74" stop-color="#fff" stop-opacity="0.64"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
  </linearGradient>
  <mask id="leftWingMask" maskUnits="userSpaceOnUse" x="0" y="0" width="125" height="190">
