<rect x="0" y="0" width="290" height="290" rx="65" fill="url(#darkBackground)"/>
<g transform="translate(21 48)"><g class="vstudy-butterfly-mark">
  <path d="M 124 94 C 107 54 76 22 28 12 C 14 9 10 13 12 30 C 15 68 29 105 46 121 C 35 145 39 173 59 183 C 76 193 100 183 124 174 Z" fill="url(#blueLower)" opacity="0.88"/>
  <path d="M 124 94 C 141 54 172 22 220 12 C 234 9 238 13 236 30 C 233 68 219 105 202 121 C 213 145 209 173 189 183 C 172 193 148 183 124 174 Z" fill="url(#violetLower)" opacity="0.92"/>
  <path d="M 124 94 C 107 54 76 22 28 12 C 14 9 10 13 12 30 C 15 68 35 110 67 137 C 91 153 110 165 124 174 Z" fill="url(#blueMain)" mask="url(#leftWingMask)"/>
  <path d="M 124 94 C 141 54 172 22 220 12 C 234 9 238 13 236 30 C 233 68 213 110 181 137 C 157 153 138 165 124 174 Z" fill="url(#violetMain)" mask="url(#rightWingMask)"/>
</g></g>
