<svg xmlns="http://www.w3.org/2000/svg" width="290" height="290" viewBox="0 0 290 290" role="img" aria-label="VStudy Pro symbol">
<title>VStudy Pro — symbol</title>
<defs>
  <!-- All symbols and type are true editable vector geometry -->
  <linearGradient id="blueMain" x1="14" y1="16" x2="124" y2="155" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#AFD2FF"/><stop offset="40%" stop-color="#7BA8FA"/>
    <stop offset="100%" stop-color="#5576EC"/>
  </linearGradient>
  <linearGradient id="violetMain" x1="124" y1="164" x2="237" y2="10" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#8A78F1"/><stop offset="57%" stop-color="#B48EF5"/>
    <stop offset="100%" stop-color="#CDA5F5"/>
  </linearGradient>
  <linearGradient id="blueLower" x1="55" y1="104" x2="105" y2="185" gradientUnits="userSpaceOnUse">
