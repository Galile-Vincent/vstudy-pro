name: Windows focused verification
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Focused pipe, CLI setup, native-addon, or Windows installer verification
        type: choice
        default: pipe
        options: [pipe, cli, native-addon, installer]
  push:
    branches: ['ci/windows-native-pipe']
permissions:
  contents: read
concurrency:
  group: windows-native-${{ github.ref }}-${{ inputs.suite || 'pipe' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CI: 'true'
jobs:
  native-pipe:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'pipe'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the production client's same-handle pipe authentication
        run: pnpm --filter @vstudy/mcp exec vitest run test/windows-pipe-native.test.ts --pool=forks --maxWorkers=2
      - name: Verify the native server, shared engine, framing, and protected state round-trip
        run: pnpm --filter @vstudy/desktop exec vitest run src/main/mcp/windows-bridge.test.ts --pool=forks --maxWorkers=2
      - name: Retain the native server acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-pipe
          path: docs/evidence/distribution/win32-mcp-roundtrip.json
          if-no-files-found: warn
          retention-days: 14
  installer:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'installer'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: win-x64
          - os: windows-11-arm
            arch: arm64
            target: win-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        id: uv
        with:
          version: '0.12.21'
          enable-cache: false
      - name: Place the converter bootstrap tool in its supported user location
        env:
          UV_EXECUTABLE: ${{ steps.uv.outputs.uv-path }}
        run: node apps/desktop/scripts/provision-ci-uv.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the unsigned native Windows installer and ZIP
        id: package
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/package-release.mjs --target "$TARGET" --unsigned
      - name: Retain the installer before checking the installed app
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-unsigned-installer-${{ matrix.target }}
          path: apps/desktop/release/${{ matrix.target }}/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Verify the standalone MCP package
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm --filter @vstudy/mcp verify:package --release-dir "../desktop/release/$TARGET"
      - name: Install, launch with MCP off and on, verify protocol registration, and uninstall
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/windows-install-smoke.mjs --target "$TARGET"
      - name: Verify native settings and keyboard labels in three languages
        working-directory: apps/desktop
        run: node e2e/cross-platform.mjs
      - name: Stage stable assets, update metadata, checksums, and provenance
        env:
          TARGET: ${{ matrix.target }}
        run: node apps/desktop/scripts/release-assets.mjs stage --target "$TARGET"
      - name: Retain installer and native app acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.target }}
          path: |
            apps/desktop/release/smoke/${{ matrix.target }}/
            docs/evidence/distribution/win32-*
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified unsigned distribution assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-${{ matrix.target }}-unsigned
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  cli-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'cli'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify native CLI installation identities, approval, and setup UI
        run: >-
          pnpm --filter @vstudy/desktop exec vitest run
          src/main/index.test.ts src/main/ipc/ai-cli.test.ts
          src/main/providers/setup/store.test.ts src/main/providers/setup/service.test.ts
          src/main/providers/setup/authenticity.test.ts src/main/providers/setup/adversarial-review.test.ts
          src/renderer/ai-cli/setup.test.tsx --pool=forks --maxWorkers=2 --reporter=verbose
  native-addon:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'native-addon'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild native modules through the same builder used for installers
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: pnpm --filter @vstudy/desktop exec electron-builder install-app-deps --platform win32 --arch "$TARGET_ARCH"
      - name: Exercise the rebuilt terminal in stock Electron
        env:
          ELECTRON_RUN_AS_NODE: '1'
          VSTUDY_NATIVE_ARCH: ${{ matrix.arch }}
        run: pnpm --filter @vstudy/desktop exec electron scripts/native-addon-smoke.mjs
      - name: Retain native-addon acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-addon-${{ matrix.arch }}
          path: apps/desktop/release/native-addon-${{ matrix.arch }}.json
          if-no-files-found: warn
          retention-days: 14
